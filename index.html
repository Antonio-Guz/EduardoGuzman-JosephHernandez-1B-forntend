<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Soya Eventos</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/pngwing.com.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Eventos Edoseph
            </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" href="clientes.html">clientes</a>
              </li>
            </ul>
          </div>
        </div>
    </nav>

    <main class="container">
      <header class="my-4">
        <h1>Eventos</h1>
        <p>Registro y consulta de eventos</p>
      </header>

      <section>
        <div class="card-body shadow px-4 pt-3 pb-5 rounded rounded-3 border">
          <h5 class="text-center">Formulario de eventos</h5>
          <form id="formEventos">

            <input type="hidden" id="idEvento">
            <div class="form-group my-3">
                <label for="txtCliente">Cliente</label>
                <select id="txtCliente" class="form-control" required>
                  <option value="">Cargando...</option>
                </select>
            </div>
            <div class="form-group my-3">
                <label for="txtSalon">Salon</label>
                <select id="txtSalon" class="form-control" required>
                  <option value="">Cargando...</option>
                </select>
            </div>
            <div class="form-group my-3">
                <label for="txtNombre">nombre del evento</label>
                <input type="text" id="txtNombre" class="form-control " maxlength="100" required>
            </div>
            <div class="form-group my-3">
                <label for="txtFecha">Fecha del evento</label>
                <input type="date" id="txtFecha" class="form-control " required>
            </div>
            <div class="form-group my-3">
                <label for="txtNumber">Cantidad de personas</label>
                <input type="text" id="txtNumber" class="form-control " required>
            </div>
             <div class="form-group my-3">
                <label for="txtHoras">Cantidad de horas</label>
                <input type="text" id="txtHoras" class="form-control " required>
            </div>
            <div class="form-group my-3 d-none" id="grupoEstado">
              <label for="txtEstado">Estado</label>
              <select name="txtEstado" id="txtEstado" class="form-control">
                <option value="">Selecciona un Estado </option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="CONFIRMADO">Confirmado</option>
                <option value="CANCELADO">Cancelado</option>
                <option value="FINALIZADO">Finalizado</option>
              </select>
            </div>

            <button type="submit" id="btnGuardar" class="btn btn-info mt-3"> GuardarRegistro</button>
            <button id="btnCancelar" class="btn btn-warning mt-3 d-none" type="button">Cancelar</button>
          </form>
        </div>

        <section class="card shadow mt-4 p-3">
          <h4 class="text-center mb-3">Historial de eventos</h4>
          <div class="bg-dark rounded p-3 table-responsive">
            <table class="table table-dark table-striped w-100">
              <thead>
                <th>ID</th>
                <th>Nombre</th>
                <th>Clientes</th>
                <th>Salon</th>
                <th>Fecha</th>
                <th>Personas</th>
                <th>Horas</th>
                <th>Pago</th>
                <th>Estado</th>
                <th>Acciones</th>
              </thead>
              <tbody id="tablaEventos" >
                <td colspan="10">Cargando...</td>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="js/controllers/indexController.js"></script>
</body>
</html>
