    <h2 class="position-absolute top-50 start-50 translate-middle">
        Hola soy la tabla
    </h2>
<form id="formClientes">

      <input type="hidden" id="idCliente">
      <div class="form-group my-3"> 
          <label for="txtNombre">nombre del cliente</label>
          <input type="text" id="txtNombre" class="form-control " required>
      </div>
      <div class="form-group my-3"> 
          <label for="txtApellido">Apellido</label>
          <input type="text" id="txtApellido" class="form-control " required>
      </div>
      <div class="form-group my-3"> 
          <label for="txtTelefono">Telefono</label>
          <input type="text" id="txtTelefono" class="form-control " required>
      </div>
      
      <div class="form-group my-3"> 
          <label for="txtEmail">Email</label>
          <input type="text" id="txtEmail" class="form-control " required>
      </div>
      <div class="form-group my-3"> 
          <label for="txtDireccion">Dirección</label>
          <input type="text" id="txtDireccion" class="form-control " required>
      </div>
      
      <button type="submit" id="btnGuardar" class="btn btn-info mt-3"> GuardarRegistro</button>
    </form>

    <table class="table-responsive w-100 table-striped">
      <thead>
        <th>Nombre</th>
