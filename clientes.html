<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Soya Eventos</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/pngwing.com.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Eventos Edoseph
            </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
            </li>
              <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="clientes.html">clientes</a>
              </li>
            </ul>
          </div>
        </div>
    </nav>

    <main class="container">
      <header class="my-4">
        <h1>Clientes</h1>
        <p>Registro y consulta de clientes</p>
      </header>

      <section>
        <div class="card-body shadow px-4 pt-3 pb-5 rounded rounded-3 border">
          <h5 class="text-center">Formulario de clientes</h5>
          <form id="formClientes">

            <input type="hidden" id="idCliente">
            <div class="form-group my-3">
                <label for="txtNombre">nombre del cliente</label>
                <input type="text" id="txtNombre" class="form-control " maxlength="100" required>
            </div>
            <div class="form-group my-3">
                <label for="txtApellido">Apellido</label>
                <input type="text" id="txtApellido" class="form-control " maxlength="100" required>
            </div>
            <div class="form-group my-3">
                <label for="txtTelefono">Telefono</label>
                <input type="text" id="txtTelefono" class="form-control " maxlength="15" required>
            </div>

            <div class="form-group my-3">
                <label for="txtEmail">Email</label>
                <input type="text" id="txtEmail" class="form-control " maxlength="100" required>
            </div>
            <div class="form-group my-3">
                <label for="txtDireccion">Dirección</label>
                <input type="text" id="txtDireccion" class="form-control " maxlength="200">
            </div>
            
            <button type="submit" id="btnGuardar" class="btn btn-info mt-3"> Guardar Registr</button>
            <button id="btnCancelar" class="btn btn-warning mt-3 d-none" type="button">Cancela</button>
          </form>
        </div>

        <section class="card shadow mt-4 p-3">
          <h4 class="text-center mb-3">Listado de cliente</h4>
          <div class="bg-dark rounded p-3 table-responsive">
            <table class="table table-dark table-striped w-100">
              <thead>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Dirección</th>
                <th>Acciones</th>
              </thead>
              <tbody id="tablaClientes" >
                <td colspan="7">Cargando...</td>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="js/controllers/clientesController.js"></script>
</body>
</html>
